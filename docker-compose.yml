# Self-hosting Washi. `cp .env.example .env`, fill in POSTGRES_PASSWORD and WASHI_SECRET_KEY,
# `docker compose up`.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: washi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: washi
    ports:
      # Loopback only, so `bun run dev:studio` on this machine can reach it. The
      # containerised studio talks to postgres:5432 instead.
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U washi']
      interval: 5s
      timeout: 5s
      retries: 10

  studio:
    build:
      context: .
      dockerfile: apps/studio/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      WASHI_MODE: hosted
      # No password in the url: Bun's SQL takes it from PGPASSWORD, so it needs no url-encoding.
      WASHI_DATABASE_URL: postgres://washi@postgres:5432/washi
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      WASHI_SECRET_KEY: ${WASHI_SECRET_KEY:?set WASHI_SECRET_KEY in .env — 32+ chars}
      WASHI_BASE_URL: ${WASHI_BASE_URL:-http://localhost:3000}
      WASHI_TRUSTED_ORIGINS: ${WASHI_TRUSTED_ORIGINS:-}
      WASHI_DATA_DIR: /data/workspaces
    ports:
      - '${STUDIO_PORT:-3000}:3000'
    volumes:
      # The workspaces. One SQLite file each — this is what a backup must cover.
      - workspaces:/data/workspaces

volumes:
  postgres:
  workspaces:
